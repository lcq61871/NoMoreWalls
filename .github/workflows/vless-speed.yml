name: VLESS Speed Test

on:
  schedule:
    - cron: '0 */6 * * *'  # 每6小时运行一次
  workflow_dispatch:       # 允许手动触发

jobs:
  test-vless:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup environment
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          curl \
          jq \
          python3 \
          python3-pip
        
        # 安装Xray-core
        bash -c "$(curl -L https://github.com/XTLS/Xray-install/raw/main/install-release.sh)" @ install
        
        # 安装Python依赖
        pip install pyyaml
        
    - name: Run VLESS tester
      run: |
        chmod +x vless.py
        python3 vless.py
        
    - name: Verify results
      run: |
        echo "=== 生成文件检查 ==="
        ls -l output/
        echo "=== vless.yml 前3行 ==="
        head -n 10 output/vless.yml || echo "文件不存在"
        echo "=== vlspeed.txt 前5行 ==="
        head -n 10 output/vlspeed.txt || echo "文件不存在"
        
    - name: Upload results
      uses: actions/upload-artifact@v3
      with:
        name: vless-results
        path: output/
        
    - name: Commit results
      if: always()
      uses: stefanzweifel/git-auto-commit-action@v4
      with:
        commit_message: "自动更新VLESS节点测试结果 [skip ci]"
        file_pattern: |
          output/vless.yml
          output/vlspeed.txt
        branch: main